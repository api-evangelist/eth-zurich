caveats:
  - >-
    Direct per-entity metadata retrieval from the IdP itself is not available:
    https://aai-logon.ethz.ch/idp/shibboleth returns 404 and
    https://aai-logon.ethz.ch/idp/profile/Metadata/SAML returns the Shibboleth error view (200).
    The authoritative machine-readable copy is the SWITCH aggregate, which SWITCH operates —
    so the metadata DISTRIBUTION is SWITCH's, while the entity, its keys and its endpoints
    are ETH's.
  - >-
    A SAML federation entry is not a REST API and must not be counted as one. It is recorded
    here, and as an IdentityFederation pointer in apis.yml, because it is a real
    institution-operated machine-readable surface and because the education regime scores
    saml and shibboleth as domain standards.
