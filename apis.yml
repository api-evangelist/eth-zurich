---
aid: eth-zurich
name: ETH Zurich – Swiss Federal Institute of Technology
description: >-
  ETH Zurich (Eidgenössische Technische Hochschule Zürich) is Switzerland's federal
  institute of technology, founded in 1855 and part of the ETH Domain. Unlike most of the
  university cohort, ETH operates a genuinely first-party programmable footprint rather
  than a set of vendor contracts running under its name. The ETH Library API Platform
  (api.library.ethz.ch) publishes seven documented OpenAPI 3.0 REST APIs — Discovery,
  ETHorama, Geo, Persons, Research Collection v1 and v2, and Vector — written and operated
  by ETH Library and specified in ETH's own eth-library/opendata-apis repository. The Swiss
  National Supercomputing Centre (CSCS), an autonomous unit of ETH Zurich, operates
  FirecREST v2, an OAuth2-secured OpenAPI 3.1 REST interface to national HPC systems at
  api.cscs.ch. ETH also runs two live OAI-PMH endpoints on its own hosts (the Research
  Collection and e-rara), a Shibboleth SAML 2.0 Identity Provider whose metadata is
  published through SWITCHaai and eduGAIN, and 308 federated service-provider entities —
  more than any other Swiss institution. What ETH does NOT publish is equally part of the
  record: there is no public API for the VVZ course catalogue (the widely used vvzapi.ch is
  a student project that states plainly it is not affiliated with or endorsed by ETH), no
  campus-life or facilities API, and no central institution-wide developer portal — the
  developer portal that exists belongs to ETH Library alone. Library discovery and open
  data reach the public through tenant relationships on platforms ETH does not operate:
  swisscovery (Ex Libris Alma/Primo via SLSP) and opendata.swiss (the Swiss federal CKAN).
