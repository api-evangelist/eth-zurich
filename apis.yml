x-coverage:
  state: covered
  reason: institution_operated_surfaces_verified
  detail: >-
    ETH Zurich is one of the few institutions in this cohort with a real first-party
    programmable footprint, and the June 2026 profile understated it in one direction while
    leaving the operator axis unstated in the other. The audit found ZERO vendor-attributed
    contracts in this repo: every OpenAPI already here resolves to api.library.ethz.ch, with
    info.contact api@library.ethz.ch and termsOfService developer.library.ethz.ch/terms, so
    all 35 existing surfaces are correctly x-operator institution. This pass added the
    surfaces the June run missed: CSCS FirecREST v2 (OpenAPI 3.1, 35 operations, OAuth2,
    served live from api.cscs.ch and copyright ETH Zurich), two live OAI-PMH endpoints, and
    the SWITCHaai/eduGAIN Shibboleth Identity Provider. It also recorded the two real tenant
    relationships — swisscovery (Ex Libris/SLSP) and opendata.swiss (Swiss federal CKAN) —
    as relationships, WITHOUT importing either vendor's contract. Honest absences: no public
    course-catalogue API (vvzapi.ch is a student project that states it is unaffiliated with
    and unendorsed by ETH, so it is not credited at any operator level), no campus-life or
    facilities API, no institution-wide developer portal, and no ORCID, SCIM, LTI, Caliper,
    OneRoster, Ed-Fi, QTI or Crossref surface on any ETH-operated host. Known probe
    limitations, about US and not about ETH: www.vvz.ethz.ch answered 200 at 21:00 UTC and
    then refused connections on three later attempts; www.e-rara.ch serves a browser
    verification interstitial at the root while its OAI-PMH endpoint answers normally; and
    the Research Collection returned an ETH-authored scraping rate-limit notice on a rapid
    second request. The 35 library entries are a per-tag split of seven underlying
    specifications, so the entry count overstates the number of distinct APIs by roughly 5x;
    the split was left in place because it is refine-openapis output over the institution's
    own correctly attributed contracts, not vendor inflation.
  evidence:
  - url: https://api.cscs.ch/hpc/firecrest/v2/openapi.json
    status: 200
