openapi: 3.2.0
info:
  title: Geo Information E Rara API
  description: 'The Geo Information REST API provides information about points of interest (places), routes and dossiers from the ETHorama database as well as maps from e-rara and e-maps. Place data is available as GeoJSON.


    ➜ OAS 3 Swagger Documentation


    ➜ ETHorama Application'
  version: 1.0.1
  termsOfService: https://developer.library.ethz.ch/terms
  contact:
    name: API Management ETH Library
    email: api@library.ethz.ch
    url: https://library.ethz.ch
  license:
    url: https://developer.library.ethz.ch/terms
    name: Bibliographic metadata that are not specifically marked are free for general use (Public Domain). Documents, images or other digital objects linked in metadata may be subject to other copyright restrictions. Whenever possible, the licence of the referenced digital objects is indicated in the metadata. In case of doubt, the licence can be inquired at api@library.ethz.ch.
servers:
- url: https://api.library.ethz.ch/geo/v1/
  description: Production
security:
- ApiKeyAuth: []
tags:
- name: e-rara
paths:
  /e-rara-maps:
    get:
      tags:
      - e-rara
      description: Returns maps from e-rara (ETH).
      parameters:
      - name: lat
        schema:
          type: number
        in: query
        required: false
        description: 'Returns maps in which the point defined by lat (latitude) and lon (longitude) is located.


          Example: lat=47.349952'
      - name: lon
        schema:
          type: number
        in: query
        required: false
        description: 'Returns maps in which the point defined by lat (latitude) and lon (longitude) is located.


          Example: lon=8.490838'
      - name: q
        schema:
          type: string
        in: query
        required: false
        description: 'Returns maps for the search term (q).The parameter "q" is alternative to "lat"/"lon".


          Example: q=kyburg'
      responses:
        '200':
          description: Returns geodata as GeoJSON
          content:
            application/json: {}
        '400':
          description: bad request
        '500':
          description: server error
      summary: Get e rara maps
      x-summary-source: derived
      operationId: getERaraMaps
      x-operation-id-source: derived
  /e-rara-maps/{id}:
    get:
      tags:
      - e-rara
      description: Returns an e-rara map and related resources.
      parameters:
      - name: id
        schema:
          type: string
        in: path
        required: true
        description: MMS ID
      - name: edges
        schema:
          type: boolean
        in: query
        required: false
        description: 'Should the edges/relations to topics, poi-items, contributors etc. also be returned (default: true)?


          Example: edges=false'
      responses:
        '200':
          description: Returns geodata as GeoJSON
          content:
            application/json: {}
        '400':
          description: bad request
        '500':
          description: server error
      summary: Get e rara maps by id
      x-summary-source: derived
      operationId: getERaraMapsById
      x-operation-id-source: derived
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: query
      name: apikey
externalDocs:
  description: OAS 3 Swagger Documentation
  url: https://apisdocs.library.ethz.ch/geo/v1/
